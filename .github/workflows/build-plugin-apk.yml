name: Build MobileGL Android Plugin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout MobileGL source
        uses: actions/checkout@v4
        with:
          repository: MobileGL-Dev/MobileGL
          ref: dev
          path: MobileGL
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.3.13750724"

      - name: Prepare glslang sources
        working-directory: MobileGL
        run: python3 update_glslang_sources.py

      - name: Build plugin APK
        run: |
          chmod +x MobileGL/gradlew
          MobileGL/gradlew --no-daemon -p MobileGL/android-plugin :app:assemblePluginRelease \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-Android-Plugin-arm64
          path: MobileGL/android-plugin/app/build/outputs/apk/plugin/release/*.apk
          if-no-files-found: error
