name: Build MobileGL Android Plugin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout MobileGL source
        uses: actions/checkout@v4
        with:
          repository: MobileGL-Dev/MobileGL
          ref: dev
          path: MobileGL
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.3.13750724"

      - name: Prepare glslang dependencies
        working-directory: MobileGL/3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: Build plugin APK
        run: |
          gradle --no-daemon -p MobileGL/android-plugin :app:assemblePluginRelease \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect APK
        run: |
          mkdir -p dist
          find MobileGL/android-plugin -type f -path '*/intermediates/apk/plugin/release/*.apk' -exec cp {} dist/ ;
          echo 'Collected APK files:'
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-Android-Plugin-arm64
          path: dist/*.apk
          if-no-files-found: error
